<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PotPlayer Replica V12</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?q=80&w=2573&auto=format&fit=crop');
            background-size: cover;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* --- THEME COLORS --- */
        :root {
            --bg-main: #141414;
            --bg-header: #1f1f1f;
            --bg-footer: #141414;
            --accent: #FFB800;
            /* PotPlayer Yellow */
            --text-main: #e0e0e0;
            --text-muted: #888;
            --border: #333;
        }

        .pot-window {
            background: var(--bg-main);
            color: var(--text-main);
            width: 800px;
            /* Wider for Playlist reference */
            height: 480px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            border: 1px solid #000;
        }

        /* --- LEFT SIDE: PLAYER --- */
        .player-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #222;
            position: relative;
        }

        /* HEADER */
        .header {
            height: 30px;
            background: var(--bg-header);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            font-size: 12px;
            border-bottom: 1px solid #2a2a2a;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pot-logo {
            color: #aaa;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .pot-logo:hover {
            color: #fff;
        }

        .file-info {
            color: var(--accent);
            opacity: 0.8;
        }

        .track-title {
            color: #ddd;
            white-space: nowrap;
            overflow: hidden;
            max-width: 200px;
            text-overflow: ellipsis;
        }

        .header-controls {
            display: flex;
            gap: 0;
            height: 100%;
        }

        .win-btn {
            width: 28px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            cursor: pointer;
        }

        .win-btn:hover {
            background: #333;
            color: #fff;
        }

        .win-btn.close:hover {
            background: #d00;
        }

        /* CONTENT AREA */
        .stage {
            flex: 1;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .album-art {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background: url('https://images.unsplash.com/photo-1470225620780-dba8ba36b745?q=80&w=2670&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            opacity: 0.6;
            mask-image: linear-gradient(to bottom, black 50%, transparent 100%);
        }

        /* INFO OVERLAY (Big Time etc) */
        .info-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: calc(100% - 40px);
            z-index: 10;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .big-time {
            font-size: 48px;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .total-time-small {
            font-size: 16px;
            color: #aaa;
            font-weight: 400;
            margin-left: 8px;
        }

        .track-details {
            font-size: 13px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 1);
        }

        .tech-info {
            color: #777;
            font-size: 11px;
            margin-left: auto;
        }

        /* VISUALIZER MOCK */
        .viz-container {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 40px;
            opacity: 0.8;
        }

        .v-bar {
            width: 3px;
            background: #3b82f6;
            animation: bounce 0.5s infinite;
        }

        @keyframes bounce {

            0%,
            100% {
                height: 5px;
            }

            50% {
                height: 100%;
            }
        }

        /* FOOTER CONTROLS */
        .footer {
            background: var(--bg-footer);
            padding: 0 0 8px 0;
            position: relative;
        }

        /* SEEK BAR */
        .seek-bar-wrapper {
            height: 12px;
            width: 100%;
            cursor: pointer;
            position: relative;
            margin-bottom: 4px;
        }

        .seek-bg {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: transparent;
        }

        .seek-progress {
            /* The actual line */
            height: 4px;
            background: var(--accent);
            width: 33%;
            margin-top: 0;
            /* Align top */
            position: relative;
        }

        .seek-progress::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -3px;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
            opacity: 1;
            /* Always show handle in PotPlayer usually? Or hover. Kept visible for clarity */
        }

        .seek-bg:hover .seek-progress {
            height: 6px;
        }


        /* BOTTOM BUTTONS ROW */
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            height: 36px;
        }

        /* BTN STYLES */
        .p-btn {
            background: transparent;
            border: none;
            color: #bbb;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .p-btn:hover {
            color: #fff;
        }

        .p-btn-lg {
            width: 36px;
            height: 36px;
            color: #fff;
        }

        .vol-slider {
            width: 60px;
            height: 4px;
            background: #444;
            border-radius: 2px;
            overflow: hidden;
            margin: 0 8px;
            cursor: pointer;
        }

        .vol-fill {
            width: 70%;
            height: 100%;
            background: var(--accent);
        }


        /* --- RIGHT SIDE: PLAYLIST --- */
        .playlist-section {
            width: 280px;
            background: #111;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #333;
        }

        .pl-header {
            height: 30px;
            background: #1f1f1f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            font-size: 11px;
            color: #aaa;
            border-bottom: 1px solid #2a2a2a;
        }

        .pl-tabs {
            display: flex;
            background: #181818;
            font-size: 11px;
        }

        .pl-tab {
            padding: 6px 12px;
            color: #888;
            cursor: pointer;
            border-top: 2px solid transparent;
        }

        .pl-tab.active {
            color: #fff;
            background: #222;
            border-top-color: var(--accent);
        }

        .pl-content {
            flex: 1;
            overflow-y: auto;
            padding: 4px 0;
        }

        .pl-item {
            display: flex;
            gap: 8px;
            padding: 4px 8px;
            font-size: 11px;
            color: #bbb;
            cursor: pointer;
        }

        .pl-item:hover {
            background: #222;
        }

        .pl-item.active {
            background: #2a2a2a;
            color: var(--accent);
        }

        .pl-item i {
            font-size: 10px;
            margin-top: 3px;
        }

        .pl-footer {
            height: 36px;
            background: #1f1f1f;
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 4px;
            border-top: 1px solid #2a2a2a;
        }

        .pl-btn {
            font-size: 9px;
            padding: 4px 8px;
            background: #333;
            color: #ccc;
            border-radius: 2px;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #111;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
    </style>
</head>

<body>

    <div class="pot-window" id="window">

        <!-- === PLAYER === -->
        <div class="player-section">
            <!-- Header -->
            <div class="header" id="drag-handle">
                <div class="header-left">
                    <div class="pot-logo">PotPlayer <i class="fas fa-caret-down text-xs"></i></div>
                    <span class="file-info">MP3</span>
                    <span class="border-l border-gray-700 h-3 mx-1"></span>
                    <span class="track-title text-gray-400">01 The Prodigy - Firestarter.mp3</span>
                </div>
                <div class="header-controls">
                    <div class="win-btn"><i class="fas fa-thumbtack text-xs rotate-45"></i></div>
                    <div class="win-btn"><i class="fas fa-minus text-xs"></i></div>
                    <div class="win-btn"><i class="far fa-square text-xs"></i></div>
                    <div class="win-btn close"><i class="fas fa-times"></i></div>
                </div>
            </div>

            <!-- Stage -->
            <div class="stage">
                <div class="album-art"></div>

                <!-- Info Overlay -->
                <div class="info-overlay">
                    <div class="flex items-end">
                        <div class="big-time">01:31</div>
                        <div class="total-time-small pb-2 text-xl opacity-60">/ 04:40</div>
                    </div>
                    <div class="track-details">
                        <i class="fas fa-music text-xs"></i>
                        <span class="font-bold text-white">The Prodigy - Firestarter.mp3</span>
                    </div>
                    <div class="flex items-center gap-3 mt-1 text-[10px] text-gray-500 font-mono">
                        <span>MP3</span>
                        <span>320kbps</span>
                        <span>44.1kHz</span>
                    </div>
                </div>

                <!-- Fake Viz -->
                <div class="viz-container">
                    <!-- Just generating a bunch of divs -->
                    <div class="v-bar" style="height: 40%"></div>
                    <div class="v-bar" style="height: 70%; animation-delay: 0.1s"></div>
                    <div class="v-bar" style="height: 30%; animation-delay: 0.2s"></div>
                    <div class="v-bar" style="height: 80%; animation-delay: 0.3s"></div>
                    <div class="v-bar" style="height: 50%; animation-delay: 0.1s"></div>
                    <div class="v-bar" style="height: 90%; animation-delay: 0.4s"></div>
                    <div class="v-bar" style="height: 20%; animation-delay: 0.2s"></div>
                    <div class="v-bar" style="height: 60%; animation-delay: 0.5s"></div>
                    <div class="v-bar" style="height: 40%; animation-delay: 0.1s"></div>
                    <div class="v-bar" style="height: 75%; animation-delay: 0.3s"></div>
                    <div class="v-bar" style="height: 35%; animation-delay: 0.2s"></div>
                    <div class="v-bar" style="height: 85%; animation-delay: 0.4s"></div>
                </div>
            </div>

            <!-- Footer -->
            <div class="footer">
                <!-- Seek -->
                <div class="seek-bar-wrapper">
                    <div class="seek-bg"></div>
                    <div class="seek-progress"></div>
                </div>

                <!-- Controls -->
                <div class="controls-row">
                    <!-- Left: Playback Controls -->
                    <div class="flex items-center gap-2">
                        <button class="p-btn" title="Previous 10s"><i class="fas fa-backward-step"></i></button>
                        <button class="p-btn p-btn-lg" title="Play/Pause"><i class="fas fa-play"></i></button>
                        <button class="p-btn" title="Next 10s"><i class="fas fa-forward-step"></i></button>
                    </div>

                    <!-- Center: Volume & Time -->
                    <div class="flex flex-1 items-center justify-center gap-4">
                        <div class="text-[11px] font-mono text-gray-400">01:31 / 04:40</div>

                        <div class="flex items-center gap-2 group cursor-pointer">
                            <i class="fas fa-volume-up text-xs text-gray-500 group-hover:text-white"></i>
                            <div class="vol-slider">
                                <div class="vol-fill"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Utils -->
                    <div class="flex items-center gap-1">
                        <button
                            class="p-btn text-[10px] font-bold text-yellow-600 hover:text-yellow-400 w-auto px-1">1.0x</button>
                        <button class="p-btn" title="Repeat"><i class="fas fa-repeat text-xs"></i></button>
                        <button class="p-btn" id="pl-toggle" title="Playlist"><i class="fas fa-bars"></i></button>
                        <button class="p-btn" title="Segments"><i class="fas fa-list-ul"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- === PLAYLIST (Collapsible) === -->
        <div class="playlist-section" id="playlist">
            <div class="pl-header">
                <span>Playlist</span>
                <div class="flex gap-2">
                    <i class="fas fa-minus text-[10px] cursor-pointer hover:text-white"></i>
                    <i class="fas fa-times text-[10px] cursor-pointer hover:text-red-500"></i>
                </div>
            </div>

            <div class="pl-tabs">
                <div class="pl-tab active">Default</div>
                <div class="pl-tab">My Computer</div>
                <div class="pl-tab">+</div>
            </div>

            <div class="pl-content">
                <div class="pl-item active">
                    <i class="fas fa-play-circle text-yellow-500"></i>
                    <div class="flex-1 truncate">01. The Prodigy - Firestarter.mp3</div>
                    <div class="text-gray-600">04:40</div>
                </div>
                <!-- Mock Items -->
                <script>
                    for (let i = 2; i < 15; i++) {
                        document.write(`
                        <div class="pl-item opacity-70">
                            <i class="fas fa-file-audio text-gray-500"></i>
                            <div class="flex-1 truncate">${i < 10 ? '0' + i : i}. Track_Sample_Audio_File_${i}.mp3</div>
                            <div class="text-gray-600">03:${10 + i}</div>
                        </div>
                        `);
                    }
                </script>
            </div>

            <div class="pl-footer">
                <button class="pl-btn">ADD</button>
                <button class="pl-btn">DEL</button>
                <button class="pl-btn">SORT</button>
                <div class="flex-1"></div>
                <i class="fas fa-search text-gray-500 mr-2"></i>
            </div>
        </div>

    </div>

    <!-- Drag Script -->
    <script>
        const windowEl = document.getElementById('window');
        const handle = document.getElementById('drag-handle');
        const plToggle = document.getElementById('pl-toggle');
        const playlist = document.getElementById('playlist');

        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        handle.addEventListener('mousedown', (e) => {
            if (e.target.closest('.win-btn')) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;

            // Getting transform offset isn't enough, we need computed style
            // Simplified: Just use top/left relative to screen
            const rect = windowEl.getBoundingClientRect();
            // Reset transform to avoid conflicts if we set top/left directly
            // But for this mock, let's just use the current rect to set absolute pos

            // We need to remove the transform centering hack to drag properly
            // converting to absolute pixel position
            windowEl.style.transform = 'none';
            windowEl.style.left = rect.left + 'px';
            windowEl.style.top = rect.top + 'px';

            initialLeft = rect.left;
            initialTop = rect.top;

            windowEl.style.cursor = 'grabbing';
            handle.style.cursor = 'grabbing';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;
            windowEl.style.left = `${initialLeft + dx}px`;
            windowEl.style.top = `${initialTop + dy}px`;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            windowEl.style.cursor = 'default';
            handle.style.cursor = 'move';
        });

        // Toggle Playlist
        plToggle.addEventListener('click', () => {
            if (playlist.style.display === 'none') {
                playlist.style.display = 'flex';
                windowEl.style.width = '800px';
            } else {
                playlist.style.display = 'none';
                windowEl.style.width = '500px';
            }
        });
    </script>
</body>

</html>
